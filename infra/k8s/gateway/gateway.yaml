apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ticketing-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      hostname: localhost
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
