apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      initContainers:
        - name: migrate
          image: orders:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["orders-migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-secret
                  key: DATABASE_URL
      containers:
        - name: orders
          image: orders:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-secret
                  key: DATABASE_URL
          ports:
            - name: grpc
              containerPort: 50053
            - name: metrics
              containerPort: 9090
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
