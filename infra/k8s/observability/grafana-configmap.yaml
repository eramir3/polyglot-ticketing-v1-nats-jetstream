apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  loki.yml: "apiVersion: 1\n\ndatasources:\n  - name: Loki\n    uid: loki\n    type:\
    \ loki\n    access: proxy\n    url: http://loki:3100\n    isDefault: true\n  \
    \  editable: false\n    jsonData:\n      maxLines: 1000\n"
  tempo.yml: "apiVersion: 1\n\ndatasources:\n  - name: Tempo\n    uid: tempo\n   \
    \ type: tempo\n    access: proxy\n    url: http://tempo:3200\n    editable: false\n"
  prometheus.yml: "apiVersion: 1\n\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n  \
    \  editable: false\n"
  dashboards.yml: "apiVersion: 1\n\nproviders:\n  - name: ticketing\n    orgId: 1\n\
    \    folder: Ticketing\n    type: file\n    disableDeletion: true\n    editable:\
    \ false\n    options:\n      path: /etc/grafana/provisioning/dashboards\n"
  k6-load-tests.json: "{\n  \"uid\": \"k6-load-tests\",\n  \"title\": \"Tickets API\
    \ Performance\",\n  \"tags\": [\"k6\", \"performance\"],\n  \"timezone\": \"browser\"\
    ,\n  \"schemaVersion\": 41,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"\
    templating\": {\n    \"list\": [\n      {\n        \"name\": \"test_type\",\n\
    \        \"label\": \"Test type\",\n        \"type\": \"query\",\n        \"datasource\"\
    : { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n        \"definition\"\
    : \"label_values(k6_http_reqs_total{source=\\\"k6\\\"}, test_type)\",\n      \
    \  \"query\": { \"query\": \"label_values(k6_http_reqs_total{source=\\\"k6\\\"\
    }, test_type)\", \"refId\": \"PrometheusVariableQueryEditor-VariableQuery\" },\n\
    \        \"includeAll\": true,\n        \"allValue\": \".+\",\n        \"multi\"\
    : true,\n        \"refresh\": 2,\n        \"sort\": 2\n      },\n      {\n   \
    \     \"name\": \"testid\",\n        \"label\": \"Test run\",\n        \"type\"\
    : \"query\",\n        \"datasource\": { \"type\": \"prometheus\", \"uid\": \"\
    prometheus\" },\n        \"definition\": \"label_values(k6_http_reqs_total{source=\\\
    \"k6\\\",test_type=~\\\"$test_type\\\"}, testid)\",\n        \"query\": { \"query\"\
    : \"label_values(k6_http_reqs_total{source=\\\"k6\\\",test_type=~\\\"$test_type\\\
    \"}, testid)\", \"refId\": \"PrometheusVariableQueryEditor-VariableQuery\" },\n\
    \        \"includeAll\": true,\n        \"allValue\": \".+\",\n        \"multi\"\
    : true,\n        \"refresh\": 2,\n        \"sort\": 2\n      },\n      {\n   \
    \     \"name\": \"endpoint\",\n        \"label\": \"Endpoint\",\n        \"type\"\
    : \"query\",\n        \"datasource\": { \"type\": \"prometheus\", \"uid\": \"\
    prometheus\" },\n        \"definition\": \"label_values(k6_http_reqs_total{source=\\\
    \"k6\\\",test_type=~\\\"$test_type\\\",testid=~\\\"$testid\\\"}, endpoint)\",\n\
    \        \"query\": { \"query\": \"label_values(k6_http_reqs_total{source=\\\"\
    k6\\\",test_type=~\\\"$test_type\\\",testid=~\\\"$testid\\\"}, endpoint)\", \"\
    refId\": \"PrometheusVariableQueryEditor-VariableQuery\" },\n        \"includeAll\"\
    : true,\n        \"allValue\": \".+\",\n        \"multi\": true,\n        \"refresh\"\
    : 2,\n        \"sort\": 2\n      }\n    ]\n  },\n  \"panels\": [\n    {\n    \
    \  \"id\": 1,\n      \"title\": \"Request rate\",\n      \"type\": \"timeseries\"\
    ,\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n\
    \      \"targets\": [{ \"expr\": \"sum(rate(k6_http_reqs_total{source=\\\"k6\\\
    \",test_type=~\\\"$test_type\\\",testid=~\\\"$testid\\\",endpoint=~\\\"$endpoint\\\
    \"}[$__rate_interval]))\", \"legendFormat\": \"requests/s\", \"refId\": \"A\"\
    \ }],\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 0 }\n    },\n\
    \    {\n      \"id\": 2,\n      \"title\": \"HTTP failure rate\",\n      \"type\"\
    : \"timeseries\",\n      \"datasource\": { \"type\": \"prometheus\", \"uid\":\
    \ \"prometheus\" },\n      \"targets\": [{ \"expr\": \"avg(k6_http_req_failed_rate{source=\\\
    \"k6\\\",test_type=~\\\"$test_type\\\",testid=~\\\"$testid\\\",endpoint=~\\\"\
    $endpoint\\\"})\", \"legendFormat\": \"failed\", \"refId\": \"A\" }],\n      \"\
    fieldConfig\": { \"defaults\": { \"unit\": \"percentunit\", \"min\": 0, \"max\"\
    : 1 }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\":\
    \ 12, \"y\": 0 }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"HTTP duration\
    \ percentiles\",\n      \"type\": \"timeseries\",\n      \"datasource\": { \"\
    type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [{ \"expr\"\
    : \"k6_http_req_duration_p95{source=\\\"k6\\\",test_type=~\\\"$test_type\\\",testid=~\\\
    \"$testid\\\",endpoint=~\\\"$endpoint\\\"}\", \"legendFormat\": \"p95\", \"refId\"\
    : \"A\" }, { \"expr\": \"k6_http_req_duration_p99{source=\\\"k6\\\",test_type=~\\\
    \"$test_type\\\",testid=~\\\"$testid\\\",endpoint=~\\\"$endpoint\\\"}\", \"legendFormat\"\
    : \"p99\", \"refId\": \"B\" }],\n      \"fieldConfig\": { \"defaults\": { \"unit\"\
    : \"ms\" }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"\
    x\": 0, \"y\": 8 }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Check\
    \ success rate\",\n      \"type\": \"timeseries\",\n      \"datasource\": { \"\
    type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [{ \"expr\"\
    : \"avg(k6_checks_rate{source=\\\"k6\\\",test_type=~\\\"$test_type\\\",testid=~\\\
    \"$testid\\\",endpoint=~\\\"$endpoint\\\"})\", \"legendFormat\": \"checks\", \"\
    refId\": \"A\" }],\n      \"fieldConfig\": { \"defaults\": { \"unit\": \"percentunit\"\
    , \"min\": 0, \"max\": 1 }, \"overrides\": [] },\n      \"gridPos\": { \"h\":\
    \ 8, \"w\": 12, \"x\": 12, \"y\": 8 }\n    },\n    {\n      \"id\": 5,\n     \
    \ \"title\": \"Active virtual users\",\n      \"type\": \"timeseries\",\n    \
    \  \"datasource\": { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n  \
    \    \"targets\": [{ \"expr\": \"sum(k6_vus{source=\\\"k6\\\",test_type=~\\\"\
    $test_type\\\",testid=~\\\"$testid\\\"})\", \"legendFormat\": \"VUs\", \"refId\"\
    : \"A\" }],\n      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"y\": 16 }\n\
    \    },\n    {\n      \"id\": 6,\n      \"title\": \"Gateway ticket requests by\
    \ method and traffic source\",\n      \"type\": \"timeseries\",\n      \"datasource\"\
    : { \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [{\
    \ \"expr\": \"sum by (method, traffic_source) (rate(ticketing_app_http_server_requests_total{environment=\\\
    \"local\\\",service=\\\"api-gateway\\\",route=\\\"/api/tickets\\\"}[$__rate_interval]))\"\
    , \"legendFormat\": \"{{method}} {{traffic_source}}\", \"refId\": \"A\" }],\n\
    \      \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 12, \"y\": 16 }\n    },\n  \
    \  {\n      \"id\": 7,\n      \"title\": \"Application CPU usage\",\n      \"\
    type\": \"timeseries\",\n      \"datasource\": { \"type\": \"prometheus\", \"\
    uid\": \"prometheus\" },\n      \"targets\": [{ \"expr\": \"100 * sum by (service)\
    \ (rate(process_cpu_seconds_total{environment=\\\"local\\\",service=~\\\"api-gateway|identity|tickets|orders|payments|expiration\\\
    \"}[$__rate_interval]))\", \"legendFormat\": \"{{service}}\", \"refId\": \"A\"\
    \ }],\n      \"fieldConfig\": { \"defaults\": { \"unit\": \"percent\", \"min\"\
    : 0 }, \"overrides\": [] },\n      \"gridPos\": { \"h\": 8, \"w\": 24, \"x\":\
    \ 0, \"y\": 24 }\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Dropped\
    \ iterations rate\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\
    \ \"type\": \"prometheus\", \"uid\": \"prometheus\" },\n      \"targets\": [{\
    \ \"expr\": \"sum(rate(k6_dropped_iterations_total{source=\\\"k6\\\",test_type=~\\\
    \"$test_type\\\",testid=~\\\"$testid\\\"}[$__rate_interval]))\", \"legendFormat\"\
    : \"dropped/s\", \"refId\": \"A\" }],\n      \"fieldConfig\": { \"defaults\":\
    \ { \"unit\": \"short\", \"min\": 0 }, \"overrides\": [] },\n      \"gridPos\"\
    : { \"h\": 8, \"w\": 24, \"x\": 0, \"y\": 32 }\n    }\n  ]\n}\n"
