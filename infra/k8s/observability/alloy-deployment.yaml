apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: alloy
        image: grafana/alloy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: p12345
          containerPort: 12345
        - name: p4318
          containerPort: 4318
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - /etc/alloy/config.alloy
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        startupProbe:
          tcpSocket:
            port: p12345
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: p12345
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: p12345
          periodSeconds: 10
          timeoutSeconds: 5
      serviceAccountName: alloy
      volumes:
      - name: config
        configMap:
          name: alloy-config
