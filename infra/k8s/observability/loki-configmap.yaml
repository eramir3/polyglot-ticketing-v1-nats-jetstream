apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  config.yml: "auth_enabled: false\n\nserver:\n  http_listen_port: 3100\n\ncommon:\n\
    \  path_prefix: /loki\n  replication_factor: 1\n  ring:\n    instance_addr: 127.0.0.1\n\
    \    kvstore:\n      store: inmemory\n\nschema_config:\n  configs:\n    - from:\
    \ 2024-01-01\n      store: tsdb\n      object_store: filesystem\n      schema:\
    \ v13\n      index:\n        prefix: index_\n        period: 24h\n\nstorage_config:\n\
    \  filesystem:\n    directory: /loki/chunks\n\ncompactor:\n  working_directory:\
    \ /loki/compactor\n  retention_enabled: true\n  delete_request_store: filesystem\n\
    \nlimits_config:\n  retention_period: 168h\n"
