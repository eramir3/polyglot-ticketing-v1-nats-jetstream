apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: p3000
          containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        startupProbe:
          tcpSocket:
            port: p3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: p3000
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: p3000
          periodSeconds: 10
          timeoutSeconds: 5
      securityContext:
        fsGroup: 472
      volumes:
      - name: config
        configMap:
          name: grafana-config
          items:
          - key: loki.yml
            path: datasources/loki.yml
          - key: tempo.yml
            path: datasources/tempo.yml
          - key: prometheus.yml
            path: datasources/prometheus.yml
          - key: dashboards.yml
            path: dashboards/dashboards.yml
          - key: k6-load-tests.json
            path: dashboards/k6-load-tests.json
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
