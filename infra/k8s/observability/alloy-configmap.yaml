apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: "discovery.kubernetes \"applications\" {\n  role = \"pod\"\n  namespaces\
    \ { names = [sys.env(\"POD_NAMESPACE\")] }\n}\ndiscovery.relabel \"applications\"\
    \ {\n  targets = discovery.kubernetes.applications.targets\n  rule {\n    source_labels\
    \ = [\"__meta_kubernetes_pod_label_app_kubernetes_io_name\"]\n    regex = \"(api-gateway|identity|tickets|orders|payments|expiration)\"\
    \n    action = \"keep\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n    regex = \"(api-gateway|identity|tickets|orders|payments|expiration)\"\n\
    \    action = \"keep\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_label_app_kubernetes_io_name\"\
    ]\n    target_label = \"service\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"\
    ]\n    target_label = \"pod\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n    target_label = \"container\"\n  }\n}\nloki.source.kubernetes \"applications\"\
    \ {\n  targets = discovery.relabel.applications.output\n  forward_to = [loki.process.applications.receiver]\n\
    }\nloki.process.applications.receiver]\n  relabel_rules    = discovery.relabel.applications.rules\n\
    \  refresh_interval = \"5s\"\n}\n\nloki.process \"applications\" {\n  stage.static_labels\
    \ {\n    values = {\n      environment = \"local\",\n    }\n  }\n\n  forward_to\
    \ = [loki.write.default.receiver]\n}\n\nloki.write \"default\" {\n  endpoint {\n\
    \    url = \"http://loki:3100/loki/api/v1/push\"\n  }\n}\n\notelcol.receiver.otlp\
    \ \"traces\" {\n  http {\n    endpoint = \"0.0.0.0:4318\"\n  }\n\n  output {\n\
    \    traces = [otelcol.processor.batch.traces.input]\n  }\n}\n\notelcol.processor.batch\
    \ \"traces\" {\n  output {\n    traces = [otelcol.exporter.otlp.tempo.input]\n\
    \  }\n}\n\notelcol.exporter.otlp \"tempo\" {\n  client {\n    endpoint = \"tempo:4317\"\
    \n\n    tls {\n      insecure             = true\n      insecure_skip_verify =\
    \ true\n    }\n  }\n}\n"
