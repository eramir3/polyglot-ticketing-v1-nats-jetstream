apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n\n\
    scrape_configs:\n  - job_name: applications\n    static_configs:\n      - targets:\
    \ [api-gateway:9090]\n        labels:\n          environment: local\n        \
    \  service: api-gateway\n      - targets: [identity:9090]\n        labels:\n \
    \         environment: local\n          service: identity\n      - targets: [tickets:9090]\n\
    \        labels:\n          environment: local\n          service: tickets\n \
    \     - targets: [orders:9090]\n        labels:\n          environment: local\n\
    \          service: orders\n      - targets: [payments:9090]\n        labels:\n\
    \          environment: local\n          service: payments\n      - targets: [expiration:9090]\n\
    \        labels:\n          environment: local\n          service: expiration\n\
    \n  - job_name: prometheus\n    static_configs:\n      - targets: [prometheus:9090]\n\
    \        labels:\n          environment: local\n          service: prometheus\n"
