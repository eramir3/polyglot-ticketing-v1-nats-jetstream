apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      initContainers:
        - name: migrate
          image: identity:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "dist/apps/identity/apps/identity/src/migrate.js"]
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: BETTER_AUTH_SECRET
      containers:
        - name: identity
          image: identity:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: BETTER_AUTH_SECRET
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
