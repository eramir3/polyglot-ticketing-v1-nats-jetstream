apiVersion: v1
kind: Secret
metadata:
  name: identity-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://identity:REPLACE_WITH_URL_ENCODED_PASSWORD@identity-db:5432/identity-db"
  POSTGRES_PASSWORD: "REPLACE_WITH_PASSWORD"
  BETTER_AUTH_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS_LONG"
