name: polyglot-ticketing-floci

services:
  floci:
    image: floci/floci:2.4.0
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: polyglot-ticketing-floci
      FLOCI_SERVICES_EKS_MOCK: 'false'
      # Contains the upstream node-IP fix; see the guide for the remaining restart limitation.
      FLOCI_SERVICES_EKS_IMAGE_TEMPLATE: rancher/k3s:v1.34.2-k3s1
      FLOCI_SERVICES_EKS_ENDPOINT_MODE: host
      FLOCI_SERVICES_EKS_DEFAULT_STORAGE_CLASS: 'true'
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    name: polyglot-ticketing-floci

volumes:
  floci-data:
